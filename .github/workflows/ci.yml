name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Configure temporary runtime paths
        run: |
          echo "HORIZON_RUNS_DIR=$RUNNER_TEMP/horizon-runs" >> "$GITHUB_ENV"
          echo "HORIZON_COMPUTE_LEDGER=$RUNNER_TEMP/horizon-compute-ledger.json" >> "$GITHUB_ENV"
          echo "HORIZON_SYSTEM_DIAGNOSTICS_DIR=$RUNNER_TEMP/horizon-system-diagnostics" >> "$GITHUB_ENV"
          echo "HORIZON_GATE_CPU_ISOLATION=required" >> "$GITHUB_ENV"
      - name: Bootstrap pinned dependencies
        env:
          HORIZON_PYTHON: python
        run: ./scripts/bootstrap.sh
      - name: Contracts, component tests, and console build
        run: ./scripts/check.sh
      - name: Audit JavaScript production and development dependencies
        run: npm audit --audit-level=moderate
      - name: Validate authorized compute reservation without launching cloud work
        run: |
          ./scripts/python.sh scripts/compute_ledger.py init
          ./scripts/python.sh scripts/run_modal_job.py --reservation a07-wasrt-sequence-002
      - name: Start and stop the implemented CPU slice
        run: ./scripts/launch_cpu.sh --smoke-seconds 1
      - name: Upload sanitized runtime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-slice-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/horizon-runs/**/run.json
            ${{ runner.temp }}/horizon-runs/**/logs/*.log
            ${{ runner.temp }}/horizon-system-diagnostics/*.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
